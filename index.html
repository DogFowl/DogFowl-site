:root{--olive:#494C28;--brown:#2C251D;--gold:#A68649;--cream:#EEDEBC}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--brown);color:var(--cream);font-family:Josefin,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px 24px}
.logo{width:min(300px,62vw);height:auto;display:block}
.rule{width:56px;height:2px;background:var(--gold);margin:40px 0 32px}
h1{font-family:Rousseau,Georgia,serif;font-weight:400;font-size:clamp(34px,7vw,64px);letter-spacing:.06em;line-height:1.1;text-transform:uppercase}
.tag{font-family:Rousseau,Georgia,serif;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:clamp(14px,2.6vw,18px);margin-top:18px}
p.lead{max-width:460px;margin-top:28px;font-size:18px;line-height:1.6}
form{display:flex;gap:10px;margin-top:32px;width:min(460px,100%)}
input[type=email]{flex:1;min-width:0;padding:15px 16px;font-family:inherit;font-size:16px;background:var(--cream);color:var(--brown);border:2px solid var(--cream);border-radius:2px}
input::placeholder{color:#6b5f4d}
button{padding:15px 22px;font-family:Rousseau,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;font-size:15px;background:var(--gold);color:var(--brown);border:2px solid var(--gold);border-radius:2px;cursor:pointer}
button:hover{background:var(--cream);border-color:var(--cream)}
input:focus,button:focus{outline:3px solid var(--cream);outline-offset:2px}

ev.preventDefault();
if(f.website.value)return;
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.value)){m.textContent='Please enter a valid email.';return}
m.textContent='Sending...';
fetch(f.action,{method:'POST',mode:'no-cors',body:new FormData(f)})
.then(function(){m.textContent='Almost done. Check your email to confirm your subscription.';f.reset()})
.catch(function(){m.textContent='Something went wrong. Please try again.'});
});
</script>
</body></html>
